# StreamClipper runtime config.
#
# Everything the listening agent and the kit builder need that is not part of
# the allow-list. Weights are unitless multipliers on each signal's own
# scale; the moment score is the sum over signals of each signal's peak value
# inside the +/-2 s window.

# --- recording -------------------------------------------------------------
recordings:
  # Disk budget for data/recordings. Recording stops when it is exceeded.
  recordings_max_gb: 200
  # Chunk length in seconds (streamlink --stream-segment-time).
  segment_seconds: 600
  # Where recordings land, relative to the repo root.
  root: data/recordings

# --- listening agent --------------------------------------------------------
listen:
  # Every signal time series lives on this grid.
  hop_seconds: 0.5
  # The scoring window around a candidate peak.
  window_seconds: 2.0
  # A candidate must score at least this to count.
  #
  # Calibrated 2026-11-16 against the two test recordings, because no
  # hand-labelled reference set exists yet (open question). One solid
  # signal is enough: a solid laugh (3.0 x ~0.35), a loudness jump of half
  # the full scale (5 LU), or a hype word with a little noise around it.
  # Raise this when a hand-labelled set arrives.
  threshold: 1.0
  # Peaks closer together than this are merged into one moment.
  merge_seconds: 20.0
  # Candidates kept per run (up to 5, ranked).
  top_n: 5
  # faster-whisper model and compute.
  whisper_model: small.en
  whisper_compute: int8
  # PANNs weights and labels: put them here yourself (never downloaded at runtime).
  panns_weights: ~/panns_data/Cnn14_DecisionLevelMax.pth
  panns_labels: ~/panns_data/class_labels_indices.csv
  # A PANNs class must reach this score before it counts.
  min_class_score: 0.25

# --- signals ----------------------------------------------------------------
signals:
  # PANNs sound events. Names are the exact AudioSet display names.
  # Music is NEGATIVE: copyrighted music inside a stream is a claim risk.
  # A negative weight only bites above this score, so a quiet music bed does
  # not cancel out every other signal.
  sound_penalty_floor: 0.5
  sound:
    "Laughter": 3.0
    "Giggle": 2.5
    "Belly laugh": 3.0
    "Chuckle, chortle": 1.5
    "Screaming": 0.4
    "Shout": 1.0
    "Yell": 0.8
    "Children shouting": 0.4
    "Cheering": 2.0
    "Applause": 2.0
    "Crowd": 1.0
    "Gasp": 1.5
    "Whoop": 1.5
    "Explosion": 0.6
    "Gunshot, gunfire": 0.5
    "Music": -1.5

  # Loudness: ffmpeg ebur128 momentary loudness, jump over a rolling baseline.
  loudness:
    weight: 2.0
    # LU above the rolling baseline before the jump counts at all.
    min_jump_lu: 3.0
    # A jump of this many LU scores the whole weight (the jump is normalised,
    # so one very loud transient cannot out-score every other signal).
    full_jump_lu: 10.0
    # The rolling baseline window, seconds.
    baseline_seconds: 60.0
    # Without this much history there is no baseline, so no jump is claimed.
    min_history_seconds: 10.0
    # Loudness below this is treated as silence.
    gate_lu: -60.0

  # Transcript hype words. Weight per hit; matched on word boundaries.
  transcript:
    weight: 1.0
    # At most this many hits count from one keyword in one window.
    max_hits_per_keyword: 3
    keywords:
      "oh my god": 2.5
      "no way": 2.0
      "here we go": 1.8
      "let's go": 2.0
      "crazy": 1.5
      "insane": 1.5
      "unbelievable": 1.5
      "wow": 1.5
      "holy": 1.5
      "clutch": 1.2
      "boom": 1.0
      "bro": 1.0
      "yo": 0.8
      "chat": 0.8
      "what": 0.6
      "hello": 0.3

  # Chat rate (optional --chat file). Messages per 10 s over the baseline.
  chat:
    weight: 2.0
    window_seconds: 10.0
    # Messages per 10 s above this count as a spike.
    min_rate: 1.0
    # The spike is relative to the chat's own median rate: 1.0 = twice the
    # baseline scores the whole weight (big streamers run dozens per window).
    full_rate: 1.0
    # Extra weight for a hype reaction inside the window (also normalised:
    # this many reactions in the window scores the whole bonus).
    reaction_weight: 1.0
    # Reactions are relative too: 2.0 = three times the usual reaction count.
    full_reactions: 2.0
    # Chat messages that count as a hype reaction (case-insensitive).
    reactions: ["lul", "lmao", "lmfao", "w", "omegalul", "pog", "poggers", "kekw", "keklEO", "kekleo", "collectiblesgoldenkekw", "icant", "clown", "😂", "🤣", "💀", "wtf", "nah", "bro", "crazy"]

# --- remix kits -------------------------------------------------------------
kit:
  # Clip length: 45-60 s total, 30-45 s build-up, 10-15 s after.
  build_up_seconds: 35
  tail_seconds: 12
  min_total_seconds: 45
  max_total_seconds: 60
  # The vertical output.
  vertical_width: 1080
  vertical_height: 1920
  # Re-encode settings for the cut clip.
  video_codec: libx264
  audio_codec: aac
  crf: 20
  audio_bitrate: 192k

# --- the review page --------------------------------------------------------
# The review page is a small HTTP server on this host. It is always bound to
# 127.0.0.1 — never to 0.0.0.0 — so it is only reachable from this machine
# or through a reverse proxy.
review_port: 8297
# Where the runs, the decisions and the hand-off folder live.
data_dir: data
# The hand-off folder: data/handoff/<account>/<run>-<kit>/.
handoff_dir: data/handoff
# Whose clipping account the approved clips go to.
account: default
